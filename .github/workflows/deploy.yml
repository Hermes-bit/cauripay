name: Tests puis mise en ligne sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # chaque jour ouvré, après la publication des taux de la BCE (vers 16 h, heure de Francfort)
  schedule:
    - cron: "30 15 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1. Tous les tests de l'émulateur, sans écran. Un seul échec = pas de mise en ligne (règle « aucun recul »).
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - run: npm ci --no-audit --no-fund
      - name: Tests complets
        run: npm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Garder le rapport des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-des-tests
          path: dev/rapports/
          if-no-files-found: ignore

  # 2. Mise en ligne, seulement si les tests sont tous verts
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Taux de référence de la BCE, servis par le site (data/taux.json) : l'appli n'appelle aucun service tiers.
      # Si la BCE ne répond pas, on garde le fichier déjà présent dans le dépôt.
      - name: Taux de change BCE du jour
        run: |
          if curl -sf --retry 3 https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml -o /tmp/bce.xml; then
            python3 - <<'PY'
          import json, re
          x = open("/tmp/bce.xml").read()
          date = re.search(r"time='([\d-]+)'", x).group(1)
          rates = {c: float(v) for c, v in re.findall(r"currency='([A-Z]{3})' rate='([\d.]+)'", x)}
          if len(rates) > 10:
              json.dump({"source": "BCE", "date": date, "rates": rates}, open("data/taux.json", "w"))
              print("Taux BCE du", date, ":", len(rates), "monnaies")
          PY
          else
            echo "BCE injoignable : taux du dépôt conservés"
          fi
      # Seuls les fichiers de l'appli sont publiés (pas les outils de test ni la documentation interne)
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html apple-touch-icon.png manifest.webmanifest .nojekyll css js icons fonts legal data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
